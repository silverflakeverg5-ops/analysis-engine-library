notes:
  - 年齢・世代・発達段階だけから能力、成熟度、人格、健康状態を断定しない
  - 発達は多方向で個人差が大きく、文化・機会・健康・役割・時代のModifierを必ず考慮する
  - 行動ログから年齢や敏感な生活段階を推定せず、本人の同意と明示申告を優先する
  - 採用・教育選抜・保険・医療など高影響領域の自動判定には直接利用しない
