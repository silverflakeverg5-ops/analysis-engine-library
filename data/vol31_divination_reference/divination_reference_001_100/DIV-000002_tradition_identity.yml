  - 入力と計算規則から再現可能な象徴配置を取得する
  - 複数の象徴を単一の性格断定へ短絡させず解釈候補として提示する
device_level: 本人同意のある入力だけを使用し、医療・雇用・教育・保険・信用・法執行の判断には利用しない
