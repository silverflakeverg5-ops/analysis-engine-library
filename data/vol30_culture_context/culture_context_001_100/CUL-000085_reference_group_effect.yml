id: CUL-000085
knowledge_type: culture_context
name_ja: 参照集団効果
name_en: Reference Group Effect
category: Culture and Context
attribute: Fairness and Localization
definition_ja: 参照集団効果は、自己評価が比較対象とする周囲の基準により変わることを表す文化文脈概念。国籍・民族・言語・地域だけから人格や能力を断定しない。
tags:
  - CAT:文化・文脈
  - CAT:公平性とローカライズ
  - ATTR:文脈補正
parent:
  - 公平性とローカライズ
related:
  - 文化背景補正
  - 社会的文脈
  - 公平性
observable_data:
  - 本人が任意に申告した言語・所属・生活文脈
  - 同意済みの場面・相手・役割情報
  - 複数文脈における表現と選択の変化
  - 翻訳版・地域版ごとの欠測と回答分布
signal_candidates:
  - 参照集団効果と整合する文脈差が同一人物の複数場面で観測される
  - 言語・相手・役割・媒体・制度の変化に伴って行動の意味または表現が変化する
device_level: 本人同意に基づく文脈情報と明示申告を利用し、行動ログから国籍・民族・宗教・移民状態を推定しない
modifiers:
  - 本人が選択した文化的所属
  - 使用言語と習熟度
  - 地域・制度
  - 家族・組織・共同体
  - 世代・コホート
  - 移動・移住経験
  - 相手との関係と権力差
  - 媒体・プラットフォーム
evidence: 文化心理学・文化人類学・社会言語学・異文化コミュニケーション・測定論・HCI研究を参照
status: active
