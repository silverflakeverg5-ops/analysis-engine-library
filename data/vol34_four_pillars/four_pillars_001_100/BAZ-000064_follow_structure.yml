id: BAZ-000064
knowledge_type: four_pillars
name_ja: 従格
name_en: Follow Structure
category: Four Pillars
attribute: Chart Structures
definition_ja: 従格は、特定の五行傾向へ従うと読む特殊構造を表す四柱推命参照概念。科学的な性格検査・心理診断・確定的予測としては扱わない。
tags:
  - CAT:四柱推命
  - CAT:格局
  - EVIDENCE:伝統的解釈
parent:
  - 格局
related:
  - 自己理解
  - 文化的象徴
  - 解釈不確実性
observable_data:
  - 利用者が明示的に提供した出生情報
  - 採用した暦・計算規則・流派
  - 入力精度と欠測
  - 計算で得られた象徴配置
signal_candidates:
  - 入力と規則から再現可能な象徴配置を得る
  - 複数要素を解釈候補として提示し単一の性格断定へ短絡させない
device_level: 本人同意のある入力だけを使用し、高影響判断・診断・能力評価には利用しない
modifiers:
  - 流派
  - 地域と時代
  - 暦と時間規則
  - 入力精度
  - 翻訳
  - 解釈目的
evidence: 歴史的・文化的な占術体系の参照情報。心理測定上の妥当性や因果的予測力を示すものではない
status: active
tradition: 四柱推命・八字
source_type: 生年月日・出生時刻・出生地・暦・節気
evidence_class: traditional_cultural_interpretation
required_inputs:
  - 生年月日
  - 出生時刻
  - 出生地
  - 時間帯
  - 使用暦
  - 日界と節気規則
calculation_basis: 出生情報を四柱の干支へ変換し陰陽五行・十神・干支関係を流派規則で整理する
trait_links:
  - 自己理解
  - 価値観
  - 意思決定
  - 対人傾向
interpretive_scope: 内省・会話・物語生成・娯楽のための解釈候補
safe_expression: 四柱推命・八字では、従格を象徴的な手掛かりの一つとして扱います。現実の性格・状態・未来を断定するものではありません。
provenance: 中国の子平法・八字・四柱推命と東アジアに展開した諸流派
